services:
  vue-app:
    image: node:16-alpine
    container_name: test-sgt-dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run serve"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
